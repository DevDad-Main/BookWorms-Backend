name: BookWorms Backend API

on:
  push:
    branches:
      - "feat/**"
    paths:
      - docker-compose.yml
      - Dockerfile
      - .github/workflows/*-backend.yml

jobs:
  compile:
    runs-on: ubuntu-latest
    name: Compile Project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Compile Project
        run: ./mvnw clean compile

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Running Unit Tests
        run: ./mvnw clean test

  build:
    runs-on: ubuntu-latest
    name: Build Backend
    needs: [compile, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Build Project
        run: ./mvnw clean package

  build-image:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Extract Project Version
        id: extract_version
        run: echo "VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookworms-api:${{ steps.extract_version.outputs.VERSION }},${{ secrets.DOCKERHUB_USERNAME }}/bookworms-api:latest
          build-args: |
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.VERSION }}

  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_VM_IP }} >> ~/.ssh/known_hosts

      - name: Create Deployment Folder on Oracle VM
        run: ssh ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }} "mkdir -p ci-cd"

      - name: Copy docker-compose to Oracle VM
        run: scp docker-compose.yml ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }}:ci-cd/docker-compose.yml

      - name: Copy keycloak config to Oracle VM
        run: |
          ssh ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }} "rm -rf ci-cd/keycloak && mkdir -p ci-cd/keycloak/themes/bookworms/login/resources/css"
          scp keycloak/realm-export.json ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }}:ci-cd/keycloak/realm-export.json
          scp keycloak/themes/bookworms/login/theme.properties ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }}:ci-cd/keycloak/themes/bookworms/login/theme.properties
          scp keycloak/themes/bookworms/login/resources/css/login.css ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }}:ci-cd/keycloak/themes/bookworms/login/resources/css/login.css

      - name: Deploy via SSH on Oracle VM
        run: |
          ssh ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }} <<EOF
          export EMAIL_HOSTNAME=${{ secrets.EMAIL_HOSTNAME }}
          export EMAIL_USER_NAME=${{ secrets.EMAIL_USER_NAME }}
          export EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          export KC_HOSTNAME_URL=${{ secrets.KC_HOSTNAME_URL }}
          cd ci-cd
          docker compose -f docker-compose.yml pull -q
          docker compose -f docker-compose.yml up -d
          EOF

      - name: Configure Keycloak Identity Providers
        run: |
          ssh ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }} <<EOF
          echo "Waiting for Keycloak to be ready..."
          until docker exec keycloak-bsn curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/realms/bookworms/ | grep -q "200"; do
            sleep 5
          done
          echo "Keycloak is ready. Configuring identity providers..."

          docker exec keycloak-bsn /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://localhost:8080 \
            --realm master \
            --user admin \
            --password admin

          docker exec keycloak-bsn /opt/keycloak/bin/kcadm.sh create identity-provider/instances \
            -r bookworms \
            -s alias=github \
            -s providerId=github \
            -s enabled=true \
            -s 'config.clientId=${{ secrets.KC_GITHUB_CLIENT_ID }}' \
            -s 'config.clientSecret=${{ secrets.KC_GITHUB_CLIENT_SECRET }}' \
            -o 2>/dev/null || \
          docker exec keycloak-bsn /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github \
            -r bookworms \
            -s 'config.clientId=${{ secrets.KC_GITHUB_CLIENT_ID }}' \
            -s 'config.clientSecret=${{ secrets.KC_GITHUB_CLIENT_SECRET }}'

          docker exec keycloak-bsn /opt/keycloak/bin/kcadm.sh create identity-provider/instances \
            -r bookworms \
            -s alias=google \
            -s providerId=google \
            -s enabled=true \
            -s 'config.clientId=${{ secrets.GOOGLE_CLIENT_ID }}' \
            -s 'config.clientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}' \
            -o 2>/dev/null || \
          docker exec keycloak-bsn /opt/keycloak/bin/kcadm.sh update identity-provider/instances/google \
            -r bookworms \
            -s 'config.clientId=${{ secrets.GOOGLE_CLIENT_ID }}' \
            -s 'config.clientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}'

          echo "Identity providers configured successfully."
          EOF
