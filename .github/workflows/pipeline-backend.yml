name: BookWorms Backend API

on:
  push:
    branches:
      - ci/pipeline
    paths:
      - docker-compose.yml
      - Dockerfile
      - .github/workflows/*-backend.yml

jobs:
  compile:
    runs-on: ubuntu-latest
    name: Compile Project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Compile Project
        run: ./mvnw clean compile

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Running Unit Tests
        run: ./mvnw clean test

  build:
    runs-on: ubuntu-latest
    name: Build Backend
    needs: [compile, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Build Project
        run: ./mvnw clean package

  build-image:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: "corretto"

      - name: Extract Project Version
        id: extract_version
        run: echo "VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookworms-api:${{ steps.extract_version.outputs.VERSION }},${{ secrets.DOCKERHUB_USERNAME }}/bookworms-api:latest
          build-args: |
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.VERSION }}

  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Create Deployment Folder on Oracle VM
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }} "mkdir -p ci-cd"

      - name: Copy docker-compose to Oracle VM
        run: scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }}:ci-cd/docker-compose.yml

      - name: Deploy via SSH on Oracle VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_VM_IP }} <<EOF
          export EMAIL_HOSTNAME=${{ secrets.EMAIL_HOSTNAME }}
          export EMAIL_USER_NAME=${{ secrets.EMAIL_USER_NAME }}
          export EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          cd ci-cd
          docker compose -f docker-compose.yml pull -q
          docker compose -f docker-compose.yml up -d
          EOF
