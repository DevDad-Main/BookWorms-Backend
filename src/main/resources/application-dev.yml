spring:
  datasource:
    url: jdbc:postgresql://book-worms-db:5432/db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        forma_fql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${EMAIL_HOSTNAME}
    port: 1025
    username: ${EMAIL_USER_NAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*" # development purposes
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
      protocol: smtp
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://keycloak-bsn:8080/realms/bookworms/protocol/openid-connect/certs"
application:
  cors:
    origins: http://localhost:4200,http://localhost:8088
  file:
    upload:
      photos-output-path: ./uploads
server:
  port: 8088
